<!DOCTYPE html>
<html>
	<head>
		<title>Random Species Generator</title>
	</head>
	<body>
		<div class="form">
			<h1 id="hero">rand-o-species</h1>
			<form>
				<select name="nameType" id="nameTypeInput">
					<option value="class">Class</option>
					<option value="phylum">Phylum</option>
				</select>
				<input list="classes" id="nameInput" type="text" value="Mammalia"></input>
				<datalist id="classes">
					<option>Mammalia</option>
					<option>Amphibia</option>
					<option>Aves</option>
					<option>Reptilia</option>
				</datalist>
				<button id="random_button" type="submit">Get Random</button>
			</form>
		</div>
		<div class="grid-container">
			<p class="section">db info</p>
			<p class="section">wikidata info</p>
			<h1 id="speciesName"></h1>
			<h1 id="speciesNameNormal" class="skeleton skeleton-text"></h1>
			<div>
				<p><a id="searchLink" target="_blank">search (on duckduckgo)</a></p>
				<p id="author"></p>
				<dl id="taxonomy">
				</dl>
			</div>
			<div>
				<p><a id="wikipediaLink"  target="_blank" class="skeleton skeleton-text"></a></p>
			</div>
		</div>
		<p style="position: absolute; bottom: 0;">Someone I know wanted a random species generator but was frustrated by the amount of beetles for a true random generator. This one lets you filter by class (e.g. Mammalia). It then searches on wikidata to get other names.
		</p>
		<script src="./wikibase-sdk.min.js"></script>
		<script src="./wikidata-sdk.min.js"></script>
		<script type="text/javascript">
			function findSpecies(event) {
				event.preventDefault();
				const nameInput = document.getElementById("nameInput").value
				const taxonRank = document.getElementById("nameTypeInput").value;

				fetch(`/query?${taxonRank}_` + new URLSearchParams({name: nameInput}).toString())
					.then(r => r.json())
					.then(displaySpecies)
			}

			function populateOptions(event) {
				const taxonRank = document.getElementById("nameTypeInput").value;
				fetch(`/list?rank=${taxonRank}`)
					.then(r => r.json())
					.then(r => {
						document.getElementById("classes").replaceChildren(...r.map(v => {
							const option = document.createElement("option");
							const valueNode = document.createTextNode(v);
							option.appendChild(valueNode);
							return option;
						}));
					});
			}

			function displaySpecies(species) {
				const author = document.getElementById('author')
				author.textContent = !species['author'] ? "unknown author" : species['author']

				const speciesName = document.getElementById('speciesName')
				speciesName.textContent = species["name"]

				const searchLink = document.getElementById('searchLink')
				searchLink.href = 'https://duckduckgo.com/?' + new URLSearchParams({q: species['name']}).toString();

				const dl = document.getElementById("taxonomy")
				const ignoredKeys = ["name", "author", "genericName"]
				let newChildren = [];

				Object.keys(species).forEach(k => {
					if (ignoredKeys.includes(k) || !species[k]) {
						return;
					}
					const keyNode = document.createTextNode(k);
					const dt = document.createElement("dt");
					dt.appendChild(keyNode);

					const valueNode = document.createTextNode(species[k]);
					const dd = document.createElement("dd");
					dd.appendChild(valueNode);

					newChildren = newChildren.concat([dt, dd]);
				});
				
				dl.replaceChildren(...newChildren);

				const wikiLink = document.getElementById('wikipediaLink');
				const wikiName = document.getElementById("speciesNameNormal");

				wikiName.textContent = 'not found';
				wikiName.classList.add('skeleton', 'skeleton-text');
				wikiLink.textContent = 'not found';
				wikiLink.classList.add('skeleton', 'skeleton-text');

				const url = wdk.searchEntities(species['name']);
				fetch(url).then(r => r.json()).then(r => {
					if (r.search.length == 0) {
						wikiName.textContent = 'not found';
						wikiName.classList.remove('skeleton', 'skeleton-text');
						wikiLink.classList.remove('skeleton', 'skeleton-text');
						return;
					}
					const name = r.search[0].label;
					const id = r.search[0].id;

					const url = wdk.getEntities([id], ['en']);
					fetch(url).then(r => r.json()).then(item => {
						const entry = item.entities[id];

						const wikipediaName = entry.sitelinks.enwiki.title;
						const wikipediaUrl = `https://en.wikipedia.org/wiki/${wikipediaName.replaceAll(' ', '_')}`;
						wikiLink.href = wikipediaUrl;
						wikiLink.textContent = wikipediaName + " on wikipedia";

						const imageRef = "P18";
						if (Object.keys(entry.claims).includes(imageRef)) {
							const filename = entry.claims[imageRef][0].mainsnak.datavalue.value.replaceAll(' ', '_');
							console.log(filename);
						}
					}).catch(() => {
						wikiLink.textContent = 'not found';
					}).finally(() => {
						wikiLink.classList.remove('skeleton', 'skeleton-text');
					});

					wikiName.textContent = name;
					wikiName.classList.remove('skeleton', 'skeleton-text');
				});
			}

			window.addEventListener("DOMContentLoaded", () => {
				document.getElementById("random_button").addEventListener('click', findSpecies);
				populateOptions();
				document.getElementById("nameTypeInput").addEventListener('change', populateOptions);
			});
		</script>
		<style>
			.skeleton {
			  animation: skeleton-loading 1s linear infinite alternate;
			}
			
			@keyframes skeleton-loading {
			  0% {
			    background-color: hsl(200, 20%, 80%);
			    color: hsl(200, 20%, 80%);
			  }
			  100% {
			    background-color: hsl(200, 20%, 95%);
			    color: hsl(200, 20%, 95%);
			  }
			}
			
			.skeleton-text {
			  width: 100%;
			  margin-bottom: 0.5rem;
			  border-radius: 0.25rem;
			}
			
			.grid-container {
				display: grid;
				grid-template-columns: 1fr 1fr;
				column-gap: 1em;
			}

			h1 {
				margin: 0;
			}

			.form {
				max-width: fit-content;
				margin: auto;
			}

			.section {
				font-family: monospace;
			}

			#hero {
				max-width: fit-content;
				margin: auto;
			}
		</style>
	</body>
</html>
